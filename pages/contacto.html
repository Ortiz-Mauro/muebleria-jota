<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mueblería Hermanos Jota</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>

<body>
    <header class="site-header">
        <div class="header-container">
        
            <!-- El logo iria a la izq del encabezado -->
            <a href="../index.html" class="logo-brand" aria-label="Hermanos Jota — Volver al Inicio">
                <img src="../assets/icons/logo.svg" alt="Logotipo Oficial de Hermanos Jota" width="45" height="40">
            </a>
        
            <!-- Esto seria el menu de navegacion, iria en el centro del encabezado -->
            <nav class="header-nav" aria-label="Navegacion principal">
                <ul class="header-nav__list">
                    <li><a href="../index.html" class="nav-link">Inicio</a></li>
                    <li><a href="./productos.html" class="nav-link">Catálogo de Productos</a></li>
                    <li><a href="./producto.html" class="nav-link">Detalle de Producto</a></li>
                    <li><a href="./contact.html" class="nav-link active" aria-current="page">Contacto</a></li>
                </ul>
            </nav>
        
            <!-- Barra de búsqueda y carrito, iria a la derecha del encabezado -->
            <div class="header-utilities">        
                <form action="" class="search-form">
                    <label for="search-input">Buscar productos</label>
                    <input type="search" id="search-input" name="search" placeholder="Buscar...">
                    <button type="submit" class="btn-minimalista" aria-label="Buscar productos">Buscar</button>
                </form>

                <a href="#" class="cart-indicator" aria-label="Ver carrito de compras">
                    <span class="cart-icon">Carrito</span>
                    <span id="cart-counter" class="cart-badge">0</span>
                </a>
            </div>
        </div>
    </header>
    <main>
        <section class="contact-section">
            <h2>Contáctanos</h2>
            <form class="contact-form" action="#" method="post">
                <div class="form-group">
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Mensaje:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn-cta">Enviar</button>
            </form>
        </section>
    </main>
</body>

</html>
